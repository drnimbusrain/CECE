# GOCART biogenic precursors from explicit MEGANv2.1 compound classes.
# Follows the offline HEMCO MEGANv2.1 GOCART lumping:
#   LIMO = limonene (explicit)
#   MTPA = alpha-pinene + beta-pinene + sabinene + 3-carene
#   MTPO = myrcene + t-beta-ocimene + alpha-farnesene + other monoterpenes
# Sources are amount fluxes (kmol compound m-2 s-1); the engine multiplies by
# the target molecular weight, so each C10 contribution is an exact mass sum.
# FARN (C15H24, 204.36 kg kmol-1) is scaled by 204.36 / 136.23 = 1.50011 so
# MTPO (C10 MW, 136.23 kg kmol-1) preserves the farnesene mass flux.
# Lumped MEGAN3 classes (MT_*, SQT_*) are not used by this mapping.
# Outputs: MEGAN_ISOP, MEGAN_LIMO, MEGAN_MTPA, MEGAN_MTPO (kg m-2 s-1).
mechanism: GOCART
datasets:
  MEGAN:
    ISOP:
      ISOP: 1.0
    LIMO:
      LIMO: 1.0
    MTPA:
      APIN: 1.0
      BPIN: 1.0
      SABI: 1.0
      CARE: 1.0
    MTPO:
      MYRC: 1.0
      OCIM: 1.0
      OMON: 1.0
