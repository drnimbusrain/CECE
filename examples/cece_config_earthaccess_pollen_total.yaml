# Aggregate total only. Never sum this tracer with its component taxon emissions.
# See docs/pollen_lur.md for licensed station LUR or free synthetic potentials.
driver:
  start_time: "2025-08-25T00:00:00"
  end_time: "2025-08-26T00:00:00"
  timestep_seconds: 3600
  earthaccess_helper: "../scripts/cece_earthaccess_standalone_ingest.py"
  grid:
    nx: 576
    ny: 361
    nz: 1
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  POLLEN_TOTAL_NUM: []
  POLLEN_TOTAL_MASS: []

physics_schemes:
  - name: pollen_total
    options:
      input_mapping:
        base_pollen_potential: TOTAL_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_TOTAL_NUM
        pollen_mass_emissions: POLLEN_TOTAL_MASS

cece_data:
  streams:
    - name: TOTAL_LUR_POTENTIAL
      file: "data/pollen/base_pollen_potential_total_2025.nc"
      yearFirst: 2025
      yearLast: 2025
      yearAlign: 2025
      taxmode: extend
      tintalgo: nearest
      mapalgo: bilinear
      variables:
        - { file: base_pollen_potential, model: TOTAL_BASE }
    - name: MERRA2_POLLEN_STATE
      source: earthaccess
      short_name: M2T1NXSLV
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        T2M: temperature
        QV2M: MERRA2_QV2M
        PS: MERRA2_PS
        U10M: MERRA2_U10M
        V10M: MERRA2_V10M
      derived_variables:
        wind_speed: { method: wind_speed, u: U10M, v: V10M }
        relative_humidity:
          method: relative_humidity
          temperature: T2M
          specific_humidity: QV2M
          pressure: PS
    - name: MERRA2_POLLEN_RAIN
      source: earthaccess
      short_name: M2T1NXFLX
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        PRECTOTCORR:
          model: precipitation_rate
          # mm s-1 -> mm h-1; independent of CECE timestep.
          scale: 3600.0

output:
  enabled: true
  directory: "./output/earthaccess_pollen_total"
  filename_pattern: "cece_pollen_total_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - { name: POLLEN_TOTAL_NUM, attributes: { units: "grains m-2 s-1" } }
    - { name: POLLEN_TOTAL_MASS, attributes: { units: "kg m-2 s-1", ctm_role: "aggregate_diagnostic" } }
