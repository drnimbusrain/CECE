# Free offline demonstration: python tools/generate_pollen_example_stream.py
# Arbitrary potentials, not measured/calibrated emission factors.
driver:
  start_time: "2020-08-25T00:00:00"
  end_time: "2020-08-26T00:00:00"
  timestep_seconds: 3600
  grid:
    nx: 30
    ny: 25
    lon_min: 115.0
    lon_max: 118.0
    lat_min: 39.0
    lat_max: 41.5

species:
  POLLEN_ARTEMISIA_NUM: []
  POLLEN_ARTEMISIA_MASS: []
  POLLEN_CHENOPOD_NUM: []
  POLLEN_CHENOPOD_MASS: []
  POLLEN_TOTAL_NUM: []
  POLLEN_TOTAL_MASS: []

# Omit refresh_interval_seconds: CECE executes every base timestep.
# Total is an independent aggregate diagnostic; never sum it with components.
physics_schemes:
  - name: pollen_artemisia
    options:
      particle_diameter_um: 22.0
      particle_density_kg_m3: 1100.0
      input_mapping:
        base_pollen_potential: ARTEMISIA_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_ARTEMISIA_NUM
        pollen_mass_emissions: POLLEN_ARTEMISIA_MASS
  - name: pollen_chenopod
    options:
      particle_diameter_um: 28.0
      particle_density_kg_m3: 1050.0
      input_mapping:
        base_pollen_potential: CHENOPOD_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_CHENOPOD_NUM
        pollen_mass_emissions: POLLEN_CHENOPOD_MASS
  - name: pollen_total
    options:
      input_mapping:
        base_pollen_potential: TOTAL_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_TOTAL_NUM
        pollen_mass_emissions: POLLEN_TOTAL_MASS

cece_data:
  streams:
    - name: POLLEN_INLINE_DEMO
      file: "data/pollen/pollen_inline_2020.nc"
      yearFirst: 2020
      yearLast: 2020
      yearAlign: 2020
      taxmode: extend
      tintalgo: nearest
      mapalgo: bilinear
      variables:
        - { file: artemisia_base, model: ARTEMISIA_BASE }
        - { file: chenopod_base, model: CHENOPOD_BASE }
        - { file: total_base, model: TOTAL_BASE }
        - { file: temperature_2m, model: temperature }
        - { file: wind_speed_10m, model: wind_speed }
        - { file: precipitation_rate, model: precipitation_rate }
        - { file: relative_humidity_2m, model: relative_humidity }

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_pollen_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - { name: POLLEN_ARTEMISIA_NUM, attributes: { units: "grains m-2 s-1" } }
    - { name: POLLEN_ARTEMISIA_MASS, attributes: { units: "kg m-2 s-1", ctm_role: "inert_primary_coarse_pm" } }
    - { name: POLLEN_CHENOPOD_NUM, attributes: { units: "grains m-2 s-1" } }
    - { name: POLLEN_CHENOPOD_MASS, attributes: { units: "kg m-2 s-1", ctm_role: "inert_primary_coarse_pm" } }
    - { name: POLLEN_TOTAL_NUM, attributes: { units: "grains m-2 s-1" } }
    - { name: POLLEN_TOTAL_MASS, attributes: { units: "kg m-2 s-1", ctm_role: "aggregate_diagnostic_do_not_sum_with_taxa" } }
