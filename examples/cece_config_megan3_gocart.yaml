# Standalone MEGAN3 configuration for the four GOCART biogenic precursors.
# Replace /path/to values and run from the repository root.
# All input files must match the ordered 72 x 46 gridspec exactly:
# lon=-180,-175,...,175; lat=-89,-86,-82,...,86,89.
# Input data are not bundled. Provide records covering the simulation times.
# Outputs follow the offline HEMCO MEGANv2.1 GOCART lumping, computed from
# explicit MEGANv2.1 compound classes (Guenther et al., 2012, GMD 5, 1471):
#   LIMO = LIMO;  MTPA = APIN + BPIN + SABI + CARE;
#   MTPO = MYRC + OCIM + FARN + OMON (FARN mass-preserved as C10-equivalent).
# Per-class parameters (beta, ldf, ct1, cleo, anew, agro, amat, aold) are
# from Guenther et al. (2012), Table 4.
# default_aef values are kmol compound m-2 s-1: the arithmetic mean of the 15
# PFT emission factors in Guenther et al. (2012), Table 2 (ug m-2 h-1), times
# 1e-9 / 3600 and divided by 136.23 (C10H16) or 204.36 (alpha-farnesene)
# kg kmol-1. They are global scalar fallbacks; gridded AEF_<CLASS> fields
# (e.g. the HEMCO MEGANv2.1 EF maps divided by the compound MW) override them.
# AEF_ISOP must be in kmol ISOP m-2 s-1; its default_aef is illustrative.
# NO is not mapped for GOCART, so no soil-NO scheme is required.

driver:
  start_time: "2021-06-20T12:00:00"
  end_time: "2021-06-20T13:00:00"
  timestep_seconds: 3600
  amio_staging_buffer_count: 8
  gridspec_file: "/path/to/hemco_4x5_gridspec.nc"
  grid:
    nx: 72
    ny: 46
    nz: 1

physics_schemes:
  - name: megan3
    language: cpp
    options:
      mechanism_file: data/speciation/spc_gocart.yaml
      speciation_file: data/speciation/map_gocart.yaml
      speciation_dataset: MEGAN
      co2_concentration: 415.0
      co2_method: possell
      enable_wind_stress: false
      enable_temp_stress: false
      enable_aq_stress: false
      day_of_year: 171
      emission_classes:
        ISOP:
          ldf: 0.9996
          ct1: 95.0
          cleo: 2.0
          beta: 0.13
          anew: 0.05
          agro: 0.6
          amat: 1.0
          aold: 0.9
          default_aef: 1.0371714e-11
        APIN:  # alpha-pinene: 307.87 ug m-2 h-1
          ldf: 0.6
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 3.305275e-13
        BPIN:  # beta-pinene: 119.07 ug m-2 h-1
          ldf: 0.2
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 1.0686349e-13
        SABI:  # sabinene: 44.19 ug m-2 h-1
          ldf: 0.6
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 3.486376e-14
        CARE:  # 3-carene: 48.75 ug m-2 h-1
          ldf: 0.2
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 4.187306e-14
        LIMO:  # limonene: 63.52 ug m-2 h-1
          ldf: 0.2
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 6.440317e-14
        MYRC:  # myrcene: 37.41 ug m-2 h-1
          ldf: 0.6
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 4.42514e-14
        OCIM:  # t-beta-ocimene: 79.87 ug m-2 h-1
          ldf: 0.8
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 9.419649e-14
        OMON:  # other monoterpenes: 114.67 ug m-2 h-1
          ldf: 0.4
          ct1: 80.0
          cleo: 1.83
          beta: 0.1
          anew: 2.0
          agro: 1.8
          amat: 1.0
          aold: 1.05
          default_aef: 1.3798347e-13

cece_data:
  streams:
    - name: MEGAN_MET
      file: "/path/to/megan_met_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: T2M, model: temperature }
        - { file: PARDR, model: par_direct }
        - { file: PARDF, model: par_diffuse }
        - { file: COSZS, model: solar_cosine }
        - { file: GWETROOT, model: soil_moisture_root }
        - { file: U10M, model: wind_speed }
    - name: MEGAN_LAI
      file: "/path/to/megan_lai_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: LAI, model: leaf_area_index }
        - { file: LAI_PREV, model: leaf_area_index_prev }
    - name: MEGAN_ISOP_AEF
      file: "/path/to/megan_isop_aef_4x5_20210620.nc"
      mapalgo: passthrough
      data_model: auto
      variables:
        - { file: AEF_ISOP, model: AEF_ISOP }
    # Optional gridded explicit-compound AEFs [kmol compound m-2 s-1]:
    # - name: MEGAN_TERP_AEF
    #   file: "/path/to/megan_terp_aef_4x5.nc"
    #   mapalgo: passthrough
    #   data_model: auto
    #   variables:
    #     - { file: AEF_APIN, model: AEF_APIN }
    #     - { file: AEF_BPIN, model: AEF_BPIN }
    #     - { file: AEF_SABI, model: AEF_SABI }
    #     - { file: AEF_CARE, model: AEF_CARE }
    #     - { file: AEF_LIMO, model: AEF_LIMO }
    #     - { file: AEF_MYRC, model: AEF_MYRC }
    #     - { file: AEF_OCIM, model: AEF_OCIM }

output:
  enabled: true
  directory: "./output/megan3_gocart"
  filename_pattern: "cece_megan3_gocart_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - name: MEGAN_ISOP
      attributes:
        units: "kg m-2 s-1"
        long_name: "GOCART isoprene emission flux"
    - name: MEGAN_LIMO
      attributes:
        units: "kg m-2 s-1"
        long_name: "GOCART limonene emission flux (MEGANv2.1 LIMO)"
    - name: MEGAN_MTPA
      attributes:
        units: "kg m-2 s-1"
        long_name: "GOCART MTPA emission flux (alpha-pinene + beta-pinene + sabinene + 3-carene)"
    - name: MEGAN_MTPO
      attributes:
        units: "kg m-2 s-1"
        long_name: "GOCART MTPO emission flux (myrcene + t-beta-ocimene + alpha-farnesene + other monoterpenes)"
