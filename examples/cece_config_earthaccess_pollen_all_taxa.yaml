cece_data:
  streams:
    - name: POLLEN_ALL_TAXA_LUR_POTENTIAL_2025
      file: "data/pollen/base_pollen_potential_all_taxa_2025.nc"
      yearFirst: 2025
      yearLast: 2025
      yearAlign: 2025
      taxmode: extend
      tintalgo: nearest
      mapalgo: bilinear
      variables:
        - { file: mugwort_base, model: MUGWORT_BASE }
        - { file: chenopod_base, model: CHENOPOD_BASE }
        - { file: ragweed_base, model: RAGWEED_BASE }
        - { file: grass_base, model: GRASS_BASE }
        - { file: alder_base, model: ALDER_BASE }
        - { file: ash_base, model: ASH_BASE }
        - { file: birch_base, model: BIRCH_BASE }
        - { file: cottonwood_base, model: COTTONWOOD_BASE }
        - { file: cypress_base, model: CYPRESS_BASE }
        - { file: elm_base, model: ELM_BASE }
        - { file: hazel_base, model: HAZEL_BASE }
        - { file: juniper_base, model: JUNIPER_BASE }
        - { file: maple_base, model: MAPLE_BASE }
        - { file: oak_base, model: OAK_BASE }
        - { file: olive_base, model: OLIVE_BASE }
        - { file: pine_base, model: PINE_BASE }
        - { file: plane_base, model: PLANE_BASE }
        - { file: nettle_base, model: NETTLE_BASE }
        - { file: total_base, model: TOTAL_BASE }

    - name: MERRA2_POLLEN_STATE
      source: earthaccess
      short_name: M2T1NXSLV
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        T2M: temperature
        QV2M: MERRA2_QV2M
        PS: MERRA2_PS
        U10M: MERRA2_U10M
        V10M: MERRA2_V10M
      derived_variables:
        wind_speed: { method: wind_speed, u: U10M, v: V10M }
        relative_humidity:
          method: relative_humidity
          temperature: T2M
          specific_humidity: QV2M
          pressure: PS

    - name: MERRA2_POLLEN_FLUX
      source: earthaccess
      short_name: M2T1NXFLX
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        PRECTOTCORR:
          model: precipitation_rate
          # mm s-1 -> mm h-1 rate, independent of the model timestep.
          scale: 3600.0

output:
  enabled: true
  directory: "./output/earthaccess_pollen_all_taxa"
  filename_pattern: "cece_pollen_all_taxa_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - POLLEN_MUGWORT_NUM
    - POLLEN_MUGWORT_MASS
    - POLLEN_CHENOPOD_NUM
    - POLLEN_CHENOPOD_MASS
    - POLLEN_RAGWEED_NUM
    - POLLEN_RAGWEED_MASS
    - POLLEN_GRASS_NUM
    - POLLEN_GRASS_MASS
    - POLLEN_ALDER_NUM
    - POLLEN_ALDER_MASS
    - POLLEN_ASH_NUM
    - POLLEN_ASH_MASS
    - POLLEN_BIRCH_NUM
    - POLLEN_BIRCH_MASS
    - POLLEN_COTTONWOOD_NUM
    - POLLEN_COTTONWOOD_MASS
    - POLLEN_CYPRESS_NUM
    - POLLEN_CYPRESS_MASS
    - POLLEN_ELM_NUM
    - POLLEN_ELM_MASS
    - POLLEN_HAZEL_NUM
    - POLLEN_HAZEL_MASS
    - POLLEN_JUNIPER_NUM
    - POLLEN_JUNIPER_MASS
    - POLLEN_MAPLE_NUM
    - POLLEN_MAPLE_MASS
    - POLLEN_OAK_NUM
    - POLLEN_OAK_MASS
    - POLLEN_OLIVE_NUM
    - POLLEN_OLIVE_MASS
    - POLLEN_PINE_NUM
    - POLLEN_PINE_MASS
    - POLLEN_PLANE_NUM
    - POLLEN_PLANE_MASS
    - POLLEN_NETTLE_NUM
    - POLLEN_NETTLE_MASS
    - POLLEN_TOTAL_NUM
    - POLLEN_TOTAL_MASS
  global_attributes:
    title: "CECE all-taxon pollen emissions with Earthaccess MERRA-2 meteorology"
