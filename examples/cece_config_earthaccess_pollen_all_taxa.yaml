      output_mapping:
        pollen_number_emissions: POLLEN_MAPLE_NUM
        pollen_mass_emissions: POLLEN_MAPLE_MASS
  - name: pollen_oak
    options:
      input_mapping:
        base_pollen_potential: OAK_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_OAK_NUM
