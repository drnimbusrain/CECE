  - name: pollen_plane
    options:
      input_mapping:
        base_pollen_potential: PLANE_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_PLANE_NUM
        pollen_mass_emissions: POLLEN_PLANE_MASS
  - name: pollen_nettle
    options:
      input_mapping:
        base_pollen_potential: NETTLE_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_NETTLE_NUM
        pollen_mass_emissions: POLLEN_NETTLE_MASS
  - name: pollen_total
    options:
      input_mapping:
        base_pollen_potential: TOTAL_BASE
      output_mapping:
