# Pollen Sense LUR base potential + online Earthaccess MERRA-2 meteorology.
# Prepare the static map as described in docs/pollen_lur.md; synthetic
# alternatives require no proprietary data. Earthdata access requires login.
driver:
  start_time: "2025-08-25T00:00:00"
  end_time: "2025-08-26T00:00:00"
  timestep_seconds: 3600
  earthaccess_helper: "../scripts/cece_earthaccess_standalone_ingest.py"
  grid:
    nx: 576
    ny: 361
    nz: 1
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

species:
  POLLEN_MUGWORT_NUM: []
  POLLEN_MUGWORT_MASS: []
  POLLEN_MUGWORT_DIAMETER: []
  POLLEN_MUGWORT_DENSITY: []

physics_schemes:
  - name: pollen_mugwort
    options:
      roughness_length_m: 0.1
      friction_velocity_threshold_m_s: 0.2
      friction_velocity_scale_m_s: 0.3
      particle_diameter_um: 22.0
      particle_density_kg_m3: 1100.0
      input_mapping:
        base_pollen_potential: MUGWORT_BASE
      output_mapping:
        pollen_number_emissions: POLLEN_MUGWORT_NUM
        pollen_mass_emissions: POLLEN_MUGWORT_MASS
        pollen_diameter: POLLEN_MUGWORT_DIAMETER
        pollen_density: POLLEN_MUGWORT_DENSITY

cece_data:
  streams:
    - name: MUGWORT_LUR_POTENTIAL
      file: "data/pollen/base_pollen_potential_mugwort_2025.nc"
      yearFirst: 2025
      yearLast: 2025
      yearAlign: 2025
      taxmode: extend
      tintalgo: nearest
      mapalgo: bilinear
      variables:
        - { file: base_pollen_potential, model: MUGWORT_BASE }
    - name: MERRA2_POLLEN_STATE
      source: earthaccess
      short_name: M2T1NXSLV
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        T2M: temperature
        QV2M: MERRA2_QV2M
        PS: MERRA2_PS
        U10M: MERRA2_U10M
        V10M: MERRA2_V10M
      derived_variables:
        wind_speed: { method: wind_speed, u: U10M, v: V10M }
        relative_humidity:
          method: relative_humidity
          temperature: T2M
          specific_humidity: QV2M
          pressure: PS
    - name: MERRA2_POLLEN_RAIN
      source: earthaccess
      short_name: M2T1NXFLX
      version: "5.12.4"
      daac: GES_DISC
      cloud_hosted: true
      temporal_start: "2025-08-25"
      temporal_end: "2025-08-27"
      variables:
        PRECTOTCORR:
          model: precipitation_rate
          # mm s-1 -> mm h-1 rate, NOT accumulation over a physics interval.
          scale: 3600.0

output:
  enabled: true
  directory: "./output/earthaccess_pollen"
  filename_pattern: "cece_pollen_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - { name: POLLEN_MUGWORT_NUM, attributes: { units: "grains m-2 s-1" } }
    - { name: POLLEN_MUGWORT_MASS, attributes: { units: "kg m-2 s-1", ctm_role: "inert_primary_coarse_pm" } }
    - { name: POLLEN_MUGWORT_DIAMETER, attributes: { units: "m" } }
    - { name: POLLEN_MUGWORT_DENSITY, attributes: { units: "kg m-3" } }
